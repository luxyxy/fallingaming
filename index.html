<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ベストキャッチャー</title>
    <style>
        /* 同階層のcode88.ttfをカスタムフォントとして定義 */
        @font-face {
            font-family: 'DotGothic16';
            src: url('code88.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* ファミコンのカラーパレットを定義 */
        :root {
            --fc-black: #000000;
            --fc-white: #f8f8f8;
            --fc-red: #a81000;       /* 象徴的な小豆色に近い赤 */
            --fc-blue: #0038b8;      /* 深い青 */
            --fc-green: #00a800;     /* 鮮やかな緑 */
            --fc-yellow: #f8b800;    /* 懐かしい黄色 */
            --fc-sky: #3cbcfc;       /* 初期作品でよくある空色 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--fc-black); /* 全体の背景色をfc-blackに変更 */
            color: var(--fc-white);
            font-family: 'DotGothic16', sans-serif;
            overflow: hidden;
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ゲーム画面（レスポンシブ・アスペクト比固定） */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100%;
            max-height: 800px;
            background-color: var(--fc-black); /* ゲーム画面の背景色をfc-blackに変更 */
            border: 4px solid var(--fc-sky);     /* 外枠線を#3cbcfcに変更 */
            overflow: hidden;
        }

        /* UIエリア */
        #ui-layer {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            z-index: 10;
            text-shadow: 2px 2px var(--fc-black);
        }

        #time-display { color: var(--fc-sky); } /* TIMEの色をfc-skyに変更 */
        #score-display { color: var(--fc-sky); } /* 右上のSCOREの色をfc-skyに変更 */

        /* ゲームキャンバス */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated; /* ドット感を強調 */
        }

        /* モーダル・画面切り替え用の共通スタイル */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 1.0); /* 不透明度を0.85から1.0に変更（透けないように修正） */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            padding: 20px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 32px;
            color: var(--fc-blue); /* タイトルの色をfc-blueに変更 */
            margin-bottom: 20px;
            text-shadow: none; /* 文字の影を無しに変更 */
        }

        .finish-text {
            font-size: 48px;
            color: var(--fc-blue); /* FINISHの色をfc-blueに変更 */
            margin-bottom: 20px;
            text-shadow: none; /* 文字の影を無しに変更 */
            /* animationを削除（点滅を無しに変更） */
        }

        .score-result {
            font-size: 24px;
            color: var(--fc-white);
            margin-bottom: 20px;
        }

        /* ファミコン風デザインの入力フォーム・ボタン */
        input[type="text"] {
            font-family: 'DotGothic16', sans-serif;
            font-size: 18px;
            padding: 8px;
            background-color: var(--fc-black);
            border: 3px solid var(--fc-white); /* 最初は枠線色をfc-whiteに設定 */
            color: var(--fc-white);
            text-align: center;
            outline: none;
            margin-bottom: 20px;
            width: 80%;
            max-width: 250px;
        }

        input[type="text"]:focus {
            border-color: var(--fc-sky); /* 入力できる状態（フォーカス時）の枠線色をfc-skyに変更 */
        }

        .fc-btn {
            font-family: 'DotGothic16', sans-serif;
            font-size: 20px;
            color: var(--fc-white);
            background-color: var(--fc-blue); /* ボタンの赤色部分をfc-blueに変更 */
            border: 3px solid var(--fc-white);
            padding: 10px 20px;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--fc-black);
            margin: 5px;
        }

        .fc-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--fc-black);
        }

        /* ランキング表示 */
        .ranking-list {
            width: 100%;
            max-width: 280px;
            margin: 15px 0;
            font-size: 16px;
            text-align: left;
        }

        .ranking-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            border-bottom: 2px dashed var(--fc-white);
            padding-bottom: 2px;
        }

        .ranking-item.top3 {
            color: var(--fc-sky); /* 上位3プレイヤーの名称・スコアの色をfc-skyに変更 */
        }

        /* スマホ用簡易コントローラー */
        #touch-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 25%;
            display: flex;
            z-index: 5;
        }
        .touch-zone {
            flex: 1;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 常時表示UIレイヤー -->
        <div id="ui-layer">
            <div id="time-display">TIME:10</div>
            <div id="score-display">SCORE:0</div>
        </div>

        <!-- メイン描画キャンバス -->
        <canvas id="gameCanvas"></canvas>

        <!-- スマホ用不可視タッチ操作ゾーン -->
        <div id="touch-controls">
            <div id="left-zone" class="touch-zone"></div>
            <div id="right-zone" class="touch-zone"></div>
        </div>

        <!-- 1. スタート画面 -->
        <div id="start-screen" class="overlay">
            <h1>ベストキャッチャー</h1>
            <button id="start-btn" class="fc-btn">START GAME</button>
        </div>

        <!-- 2. フィニッシュ画面 / スコア入力 -->
        <div id="finish-screen" class="overlay hidden">
            <div class="finish-text">FINISH！</div>
            <div class="score-result">YOUR SCORE:<br><span id="result-score" style="color:var(--fc-sky); font-size:36px;">0</span></div> <!-- SCOREの色をfc-skyに変更 -->
            <input type="text" id="player-name" placeholder="YOUR NAME" maxlength="8">
            <button id="submit-btn" class="fc-btn">REGISTRATION</button>
        </div>

        <!-- 3. ランキング表示画面 -->
        <div id="ranking-screen" class="overlay hidden">
            <h1 style="color:var(--fc-sky); text-shadow: none;">TOP PLAYERS</h1> <!-- TOP PLAYERSの色をfc-sky、影を無しに変更 -->
            <div id="ranking-board" class="ranking-list">
                <!-- JavaScriptにより動的に生成 -->
            </div>
            <button id="restart-btn" class="fc-btn">TITLE SCREEN</button>
        </div>
    </div>

    <!-- 分割した外部JSファイルをモジュールとして読み込み -->
    <script type="module" src="code0099.js"></script>
</body>
</html>
