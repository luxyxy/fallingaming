<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>UFO Catch Game</title>
    <style>
        /* ベーススタイル */
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 240px;
            height: 320px;
            background-color: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UIレイヤー共通 */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.85);
            text-align: center;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        /* プレイ中のヘッダーHUD */
        #hud {
            position: absolute;
            top: 5px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
            box-sizing: border-box;
            font-size: 12px;
            font-weight: bold;
            z-index: 5;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
        }

        /* タッチ操作用ゾーン */
        #touch-controls {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            z-index: 4;
        }
        .touch-zone {
            width: 50%;
            height: 100%;
        }

        /* ボタン・入力フォーム */
        h1 { font-size: 18px; margin-bottom: 20px; color: #0f0; text-shadow: 0 0 5px #0f0; }
        h2 { font-size: 14px; margin: 5px 0; }
        p { font-size: 12px; margin: 10px 0; }
        
        button {
            background: #000;
            color: #0f0;
            border: 2px solid #0f0;
            padding: 6px 12px;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            margin: 5px;
            box-shadow: 0 0 5px rgba(0,255,0,0.5);
        }
        button:active:not(:disabled) {
            background: #0f0;
            color: #000;
        }
        button:disabled {
            color: #555;
            border-color: #555;
            box-shadow: none;
            cursor: not-allowed;
        }

        input[type="text"] {
            background: #111;
            border: 1px solid #0f0;
            color: #fff;
            padding: 4px;
            width: 120px;
            text-align: center;
            font-family: inherit;
            font-size: 12px;
            margin-bottom: 10px;
        }

        /* ランキングボード */
        #ranking-board {
            width: 90%;
            margin: 10px 0;
            font-size: 11px;
            text-align: left;
        }
        .ranking-item {
            display: flex;
            justify-content: space-between;
            margin: 4px 0;
            border-bottom: 1px dashed #333;
            padding-bottom: 2px;
        }
        .top3 {
            color: #ff0;
            font-weight: bold;
            text-shadow: 0 0 3px rgba(255,255,0,0.5);
        }

        /* ページネーションコントロール */
        #ranking-pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 5px 0 10px 0;
        }
        #ranking-pagination button {
            padding: 3px 8px;
            font-size: 10px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="hud">
        <div id="score-display">SCORE:0</div>
        <div id="time-display">TIME:10</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="touch-controls">
        <div id="left-zone" class="touch-zone"></div>
        <div id="right-zone" class="touch-zone"></div>
    </div>

    <div id="start-screen" class="ui-layer">
        <h1>UFO CATCHER</h1>
        <p>A/D or Keys to Move</p>
        <button id="start-btn">START GAME</button>
    </div>

    <div id="finish-screen" class="ui-layer hidden">
        <h1>GAME OVER</h1>
        <h2>YOUR SCORE: <span id="result-score">0</span></h2>
        <p>ENTER YOUR NAME (MAX 8)</p>
        <input type="text" id="player-name" placeholder="MARIO" maxlength="8">
        <button id="submit-btn">REGISTRATION</button>
    </div>

    <div id="ranking-screen" class="ui-layer hidden">
        <h1>TOP RANKING</h1>
        <div id="ranking-board">LOADING...</div>
        
        <div id="ranking-pagination">
            <button id="prev-page-btn" disabled>PREV</button>
            <button id="next-page-btn" disabled>NEXT</button>
        </div>

        <button id="restart-btn">BACK TO TITLE</button>
    </div>
</div>

<script type="module" src="code0099.js"></script>
</body>
</html>
