<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レトロキャッチゲーム</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body id="gameContainer">

    <!-- スコア表示ボード (Canvasの外) -->
    <div id="scoreDisplay">SCORE: 0</div>
    <canvas id="gameCanvas"></canvas>

    <!-- メッセージオーバーレイ (スタート/フィニッシュ用。共通のIDを使うことで切り替えを容易にしています) -->
    <div id="messageOverlay" class="hidden">
        <h1 id="overlayTitle">キャッチボールゲーム</h1>
        <p id="overlaySubText" style="margin-bottom: 30px;">ボールをキャッチしてスコアを獲得せよ！</p>
        <button id="startButton">START GAME!</button>
    </div>

    <!-- ランキングフォーム (隠し状態) -->
    <div id="rankingForm" class="hidden">
        <h2>🏅 ランキングに記録 🏅</h2>
        <p id="finalScoreText"></p>
        <input type="text" id="playerNameInput" placeholder="あなたの名前を入力...">
        <button id="submitScoreButton">登録する</button>
        <div id="rankingMessage"></div>
    </div>

    <!-- ============================ -->
    <!-- ✨ ライブラリとスクリプトの読み込み順序が重要です！ -->
    <!-- 🚨 type="module" を指定することで、ES Modulesとして正しく動作します。-->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>

    <!-- 独自のモジュールファイルを読み込む -->
    <script type="module" src="./firebase-config.js"></script>
    <script type="module" src="./game.js"></script>

</body>
</html>
